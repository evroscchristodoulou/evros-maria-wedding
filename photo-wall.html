<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf9f7"><title>Wedding photo wall · Evros &amp; Maria</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet"><style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#faf9f7;color:#292723;font-family:Inter,Arial,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:16px 4vw;border-bottom:1px solid #e2dcd3}header a{color:inherit;text-decoration:none;font-family:'Cormorant Garamond',Georgia,serif;font-size:24px}header button{border:1px solid #dcd6cc;border-radius:20px;background:transparent;padding:8px 14px;cursor:pointer}main{max-width:1500px;margin:auto;padding:35px 4vw 60px}.eyebrow{text-align:center;font-size:10px;letter-spacing:.25em;color:#8c8175}h1{text-align:center;font:300 clamp(40px,6vw,76px) 'Cormorant Garamond',Georgia,serif;margin:10px 0 6px}p{text-align:center;color:#81796f;font-size:12px}.toolbar{display:flex;justify-content:center;align-items:center;gap:12px;margin:22px auto 30px;flex-wrap:wrap}.toolbar a,.toolbar button{padding:11px 18px;border:1px solid #d8d0c6;border-radius:8px;color:#342e29;text-decoration:none;background:#fffdfa;font-size:12px;cursor:pointer}.wall{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.photo{margin:0;aspect-ratio:4/3;overflow:hidden;background:#eae5de;border-radius:7px}.photo img{display:block;width:100%;height:100%;object-fit:cover}.wall-empty{grid-column:1/-1;padding:55px 20px;border:1px solid #e3ddd4}.screen-mode header,.screen-mode .toolbar,.screen-mode .eyebrow,.screen-mode p{display:none}.screen-mode main{max-width:none;padding:15px}.screen-mode h1{margin:0 0 12px;font-size:40px}.screen-mode .wall{grid-template-columns:repeat(4,1fr);gap:8px}.screen-mode .photo{aspect-ratio:4/3}@media(max-width:850px){.wall{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.wall{grid-template-columns:repeat(2,1fr);gap:7px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body><header><a href="./">E &amp; M</a><button id="language" type="button">ΕΛ / EN</button></header><main><div class="eyebrow">10 · 06 · 2028</div><h1 data-en="Our moments, together." data-el="Οι στιγμές μας, μαζί.">Our moments, together.</h1><p data-en="Wedding photo wall · refreshes automatically" data-el="Το άλμπουμ του γάμου · αυτόματη ανανέωση">Wedding photo wall · refreshes automatically</p><div class="toolbar"><a href="./upload.html" data-en="Share your photos ↗" data-el="Μοιραστείτε φωτογραφίες ↗">Share your photos ↗</a><a href="./album.html" data-en="Open gallery ↗" data-el="Άλμπουμ ↗">Open gallery ↗</a><button id="screen" type="button" data-en="Presentation mode ⛶" data-el="Προβολή σε οθόνη ⛶">Presentation mode ⛶</button><button id="refresh" type="button" data-en="Refresh photos ↻" data-el="Ανανέωση ↻">Refresh photos ↻</button></div><p id="status" aria-live="polite">Loading photos…</p><div class="wall" id="wall"></div></main><script>const API='https://evros-maria-wedding.evros-christodoulou1995.workers.dev';let lang=localStorage.getItem('wedding-lang')==='el'?'el':'en',loading=false,known=new Set();const wall=document.getElementById('wall'),status=document.getElementById('status');function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(el=>el.textContent=el.dataset[lang])}document.getElementById('language').onclick=()=>{lang=lang==='en'?'el':'en';localStorage.setItem('wedding-lang',lang);translate()};document.getElementById('screen').onclick=()=>{document.body.classList.toggle('screen-mode');if(document.body.classList.contains('screen-mode')&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})};async function refresh(){if(loading)return;loading=true;try{let cursor=null,photos=[],pages=0;do{const url=API+'/photos/list'+(cursor?'?cursor='+encodeURIComponent(cursor):'');const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();photos.push(...(data.photos||[]));cursor=data.cursor;pages++}while(cursor&&pages<12);const ids=new Set(photos.map(p=>p.id));for(const node of [...wall.children])if(!ids.has(node.dataset.id))node.remove();for(const p of photos){if(known.has(p.id)&&wall.querySelector('[data-id="'+CSS.escape(p.id)+'"]'))continue;const fig=document.createElement('figure'),img=document.createElement('img');fig.className='photo';fig.dataset.id=p.id;img.loading='lazy';img.alt='Wedding memory';img.src=API+'/photos/view?id='+encodeURIComponent(p.id);fig.append(img);wall.append(fig);known.add(p.id)}status.textContent=photos.length?(lang==='el'?photos.length+' φωτογραφίες':photos.length+' photos'):(lang==='el'?'Δεν υπάρχουν φωτογραφίες ακόμα.':'No photos yet.');if(!photos.length&&!wall.querySelector('.wall-empty')){const empty=document.createElement('div');empty.className='wall-empty';empty.textContent=status.textContent;wall.append(empty)}else if(photos.length){wall.querySelector('.wall-empty')?.remove()}}catch(e){status.textContent='Photo wall unavailable: '+e.message}finally{loading=false}}document.getElementById('refresh').onclick=refresh;translate();refresh();setInterval(refresh,30000);</script></body></html>
