<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf9f7"><title>RSVP · Evros & Maria</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--ink:#25231f;--muted:#77736d;--line:#e3dfd7}*{box-sizing:border-box}body{margin:0;background:#faf9f7;color:var(--ink);font:14px/1.7 Inter,sans-serif}header{padding:20px max(22px,5vw);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}header a{font-family:"Cormorant Garamond",serif;font-size:27px;color:inherit;text-decoration:none}header button{border:0;background:transparent;cursor:pointer;font:12px Inter;color:var(--ink)}main{max-width:650px;margin:65px auto 100px;padding:0 24px}.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}h1{font:normal 54px/1.1 "Cormorant Garamond",serif;margin:18px 0 12px}p{color:var(--muted)}form{margin-top:36px}label{display:block;margin:18px 0 6px;font-size:12px}input,select,textarea{width:100%;padding:13px 14px;border:1px solid #d5d1c9;background:transparent;border-radius:0;font:14px Inter;color:var(--ink)}textarea{min-height:90px;resize:vertical}input:focus,textarea:focus,select:focus{outline:1px solid #77736d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.btn{padding:14px 24px;border:1px solid var(--ink);background:var(--ink);color:white;cursor:pointer;font:12px Inter;letter-spacing:1px;margin-top:24px}.secondary{background:transparent;color:var(--ink);margin-left:10px}.hint{font-size:12px;color:var(--muted)}.notice{margin-top:22px;white-space:pre-wrap}a{color:inherit}.hidden{display:none!important}footer{text-align:center;padding:30px;font-size:10px;letter-spacing:2px;color:var(--muted)}@media(max-width:480px){h1{font-size:45px}.grid{gap:10px}}</style></head><body><header><a href="./">E &amp; M</a><button id="language" type="button">ΕΛ / EN</button></header><main><div class="eyebrow">EVROS &amp; MARIA · 10.06.2028</div><h1 data-en="Kindly reply." data-el="Παρακαλούμε απαντήστε.">Kindly reply.</h1><p data-en="We would love to celebrate with you. Please let us know if you can join us on 10 June 2028." data-el="Θα χαρούμε πολύ να γιορτάσουμε μαζί σας. Ενημερώστε μας αν θα είστε κοντά μας στις 10 Ιουνίου 2028.">We would love to celebrate with you. Please let us know if you can join us on 10 June 2028.</p><form id="rsvp"><label for="name" data-en="Your name / family name" data-el="Όνομα / οικογενειακό όνομα">Your name / family name</label><input id="name" required maxlength="100" autocomplete="name"><label for="attending" data-en="Will you attend?" data-el="Θα παρευρεθείτε;">Will you attend?</label><select id="attending"><option value="yes" data-en="Joyfully accepts" data-el="Με χαρά θα παρευρεθώ">Joyfully accepts</option><option value="no" data-en="Regretfully declines" data-el="Δυστυχώς δεν θα μπορέσω">Regretfully declines</option></select><div class="grid" id="counts"><div><label for="adults" data-en="Adults" data-el="Ενήλικες">Adults</label><input id="adults" type="number" min="0" max="20" step="1" value="1" required></div><div><label for="children" data-en="Children" data-el="Παιδιά">Children</label><input id="children" type="number" min="0" max="20" step="1" value="0" required></div></div><div id="details"><label for="dietary" data-en="Dietary requirements (optional)" data-el="Διατροφικές ανάγκες (προαιρετικά)">Dietary requirements (optional)</label><textarea id="dietary" maxlength="400"></textarea></div><label for="notes" data-en="A note for us (optional)" data-el="Ένα μήνυμα για εμάς (προαιρετικά)">A note for us (optional)</label><textarea id="notes" maxlength="400"></textarea><button class="btn" id="submit" type="submit" data-en="Send RSVP" data-el="Αποστολή απάντησης">Send RSVP</button><button class="btn secondary hidden" id="remove" type="button" data-en="Cancel my RSVP" data-el="Διαγραφή της απάντησής μου">Cancel my RSVP</button></form><div class="notice" id="status" role="status" aria-live="polite"></div><div class="hint" id="link"></div><p><a href="./" data-en="← Back to wedding website" data-el="← Επιστροφή στην ιστοσελίδα">← Back to wedding website</a></p></main><footer>EVROS &amp; MARIA · 10.06.2028</footer><script>
const API='https://evros-maria-wedding.evros-christodoulou1995.workers.dev',params=new URLSearchParams(location.hash.slice(1));let lang=localStorage.getItem('wedding-lang')==='el'?'el':'en';const $=id=>document.getElementById(id),id=params.get('id'),token=params.get('token');let editing=false;
function t(en,el){return lang==='el'?el:en}function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(el=>el.textContent=el.dataset[lang])}function attendance(){const yes=$('attending').value==='yes';$('counts').classList.toggle('hidden',!yes);$('details').classList.toggle('hidden',!yes);if(!yes){$('adults').value=0;$('children').value=0}else if(Number($('adults').value)+Number($('children').value)===0)$('adults').value=1}
$('language').onclick=()=>{lang=lang==='en'?'el':'en';localStorage.setItem('wedding-lang',lang);translate()};$('attending').onchange=attendance;
function data(){return {name:$('name').value.trim(),attending:$('attending').value==='yes',adults:Number($('adults').value),children:Number($('children').value),dietary:$('dietary').value.trim(),notes:$('notes').value.trim()}}
async function post(path,body){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}
async function load(){if(!id||!token)return;try{const d=await post('/wedding/rsvp/manage',{id,token,action:'read'}),e=d.entry;editing=true;$('name').value=e.name;$('attending').value=e.attending?'yes':'no';$('adults').value=e.adults;$('children').value=e.children;$('dietary').value=e.dietary||'';$('notes').value=e.notes||'';attendance();$('remove').classList.remove('hidden');$('submit').dataset.en='Update RSVP';$('submit').dataset.el='Ενημέρωση απάντησης';translate();$('status').textContent=t('You can update your existing reply.','Μπορείτε να ενημερώσετε την απάντησή σας.')}catch(e){$('status').textContent=e.message}}
$('rsvp').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('status').textContent=t('Sending…','Αποστολή…');try{const d=await post(editing?'/wedding/rsvp/manage':'/wedding/rsvp',editing?{...data(),id,token,action:'edit'}:data());$('status').textContent=t('Thank you! Your RSVP has been saved.','Ευχαριστούμε! Η απάντησή σας αποθηκεύτηκε.');if(!editing){const link=location.href.split('#')[0]+'#id='+encodeURIComponent(d.id)+'&token='+encodeURIComponent(d.token);$('link').replaceChildren();const p=document.createElement('p'),a=document.createElement('a');p.textContent=t('Save this private link to change or cancel your RSVP later:','Κρατήστε αυτόν τον προσωπικό σύνδεσμο για αλλαγή ή ακύρωση:');a.href=link;a.textContent=link;$('link').append(p,a);history.replaceState(null,'',link);editing=true;$('remove').classList.remove('hidden');$('submit').dataset.en='Update RSVP';$('submit').dataset.el='Ενημέρωση απάντησης';translate()}}catch(err){$('status').textContent=err.message}finally{$('submit').disabled=false}};
$('remove').onclick=async()=>{if(!confirm(t('Cancel your RSVP permanently?','Οριστική διαγραφή της απάντησης;')))return;try{await post('/wedding/rsvp/manage',{id:new URLSearchParams(location.hash.slice(1)).get('id'),token:new URLSearchParams(location.hash.slice(1)).get('token'),action:'delete'});history.replaceState(null,'',location.pathname);$('rsvp').classList.add('hidden');$('link').replaceChildren();$('status').textContent=t('Your RSVP was cancelled.','Η απάντησή σας διαγράφηκε.')}catch(e){$('status').textContent=e.message}};
translate();attendance();load();
</script></body></html>
