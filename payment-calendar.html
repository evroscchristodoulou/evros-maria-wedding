<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding Payment Calendar · Evros & Maria</title><link rel="icon" type="image/svg+xml" href="./favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{background:#faf9f7;color:#2b2925;margin:0;font:13px/1.7 Inter,Arial,sans-serif}header{padding:18px 5vw;display:flex;justify-content:space-between;border-bottom:1px solid #e4ded5}header a{font:28px 'Cormorant Garamond',serif;color:inherit;text-decoration:none}main{max-width:1000px;margin:auto;padding:48px 20px 80px}h1{font:400 clamp(38px,6vw,56px) 'Cormorant Garamond',serif;margin:0 0 8px}h2{font:400 29px 'Cormorant Garamond',serif;margin:0}.muted{color:#80786f}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}button,.btn{border:1px solid #d4cabe;background:#fffdfa;padding:9px 13px;border-radius:6px;color:#292620;cursor:pointer;text-decoration:none;font:12px Inter}.panel{border:1px solid #e2dacf;background:#fffdfa;border-radius:12px;padding:20px;margin:18px 0}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{min-height:85px;border:1px solid #e7e1d8;border-radius:6px;padding:8px;overflow-wrap:anywhere}.day.empty{border-color:transparent}.day strong{font-size:12px}.day.today{border-color:#9c8a73}.event{background:#f0eae1;padding:5px;margin-top:5px;border-radius:4px;font-size:10px}.event.overdue{background:#f5e4dd}.weekday{text-align:center;color:#80786f;font-size:11px;padding:8px 0}.item{padding:12px 0;border-bottom:1px solid #eee7df}.management-menu{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:14px;border-bottom:1px solid #e3dfd7}.management-menu a{padding:8px 12px;border:1px solid #ded8ce;text-decoration:none;color:inherit;border-radius:5px;font-size:11px}@media(max-width:640px){.day{min-height:70px;padding:3px}.event{font-size:9px;padding:2px}.panel{padding:10px}} </style></head><body><header><a href="./">E &amp; M</a><button id="language">ΕΛ / EN</button></header><nav class="management-menu"><a href="./dashboard.html" data-en="Dashboard" data-el="Πίνακας">Dashboard</a><a href="./suppliers.html" data-en="Budget" data-el="Έξοδα">Budget</a><a href="./planning-checklist.html" data-en="Checklist" data-el="Λίστα">Checklist</a><a href="./seating-arrangement.html" data-en="Seating" data-el="Τραπέζια">Seating</a></nav><main><p class="muted">EVROS &amp; MARIA · 10.06.2028</p><h1 data-en="Wedding payment calendar." data-el="Ημερολόγιο πληρωμών γάμου.">Wedding payment calendar.</h1><p data-en="Payment deadlines from your wedding budget, on this device." data-el="Προθεσμίες πληρωμών από τα έξοδα γάμου, σε αυτή τη συσκευή.">Payment deadlines from your wedding budget, on this device.</p><div class="panel"><div class="row"><button id="prev">←</button><h2 id="month"></h2><button id="next">→</button><button id="current" data-en="Current month" data-el="Τρέχων μήνας">Current month</button></div><div class="days" id="weekdays"></div><div class="days" id="calendar"></div></div><div class="panel"><h2 data-en="Payments in this month" data-el="Πληρωμές αυτού του μήνα">Payments in this month</h2><div id="items"></div></div><p><a class="btn" href="./suppliers.html" data-en="Manage wedding expenses →" data-el="Διαχείριση εξόδων →">Manage wedding expenses →</a></p></main><script>let lang=localStorage.getItem('wedding-lang')==='el'?'el':'en';const t=(en,el)=>lang==='el'?el:en;const $=id=>document.getElementById(id);let current=new Date(),suppliers=[];current.setDate(1);function read(){try{const a=JSON.parse(localStorage.getItem('em-suppliers-v1')||'[]');suppliers=Array.isArray(a)?a:[]}catch{suppliers=[]}}function paid(s){return Array.isArray(s.payments)?s.payments.reduce((n,p)=>n+(Number(p.amount)||0),0):Number(s.paid)||0}function euro(n){return '€'+Number(n).toLocaleString('en-CY',{minimumFractionDigits:2,maximumFractionDigits:2})}function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(el=>el.textContent=el.dataset[lang]);render()}$('language').onclick=()=>{lang=lang==='en'?'el':'en';localStorage.setItem('wedding-lang',lang);translate()};$('prev').onclick=()=>{current.setMonth(current.getMonth()-1);render()};$('next').onclick=()=>{current.setMonth(current.getMonth()+1);render()};$('current').onclick=()=>{current=new Date();current.setDate(1);render()};function render(){read();const locale=lang==='el'?'el-CY':'en-GB',year=current.getFullYear(),month=current.getMonth();$('month').textContent=current.toLocaleDateString(locale,{month:'long',year:'numeric'});$('weekdays').replaceChildren();for(const d of lang==='el'?['Δε','Τρ','Τε','Πε','Πα','Σα','Κυ']:['Mon','Tue','Wed','Thu','Fri','Sat','Sun']){const el=document.createElement('div');el.className='weekday';el.textContent=d;$('weekdays').append(el)}const grid=$('calendar'),items=$('items');grid.replaceChildren();items.replaceChildren();const first=(new Date(year,month,1).getDay()+6)%7,last=new Date(year,month+1,0).getDate(),prefix=year+'-'+String(month+1).padStart(2,'0')+'-';for(let i=0;i<first;i++){const el=document.createElement('div');el.className='day empty';grid.append(el)}let total=0;for(let day=1;day<=last;day++){const key=prefix+String(day).padStart(2,'0'),cell=document.createElement('div');cell.className='day';if(key===new Date().toLocaleDateString('en-CA'))cell.classList.add('today');const heading=document.createElement('strong');heading.textContent=day;cell.append(heading);for(const s of suppliers.filter(x=>x.due===key&&Number(x.cost)>paid(x))){total++;const remaining=Number(s.cost)-paid(s),tag=document.createElement('div');tag.className='event'+(key<new Date().toLocaleDateString('en-CA')?' overdue':'');tag.textContent=s.name+' · '+euro(remaining);cell.append(tag);const item=document.createElement('div');item.className='item';item.textContent=key+' · '+s.name+' · '+t('Remaining','Υπόλοιπο')+' '+euro(remaining);items.append(item)}grid.append(cell)}if(!total){const empty=document.createElement('p');empty.className='muted';empty.textContent=t('No outstanding payments due this month.','Δεν υπάρχουν εκκρεμείς πληρωμές αυτόν τον μήνα.');items.append(empty)}}translate();window.addEventListener('storage',render);</script></body></html>
