<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guest Announcements · Evros & Maria</title><link rel="icon" type="image/svg+xml" href="./favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#faf9f7;color:#2b2925;font:13px/1.7 Inter,Arial,sans-serif}header{padding:18px 5vw;border-bottom:1px solid #e4ded6;display:flex;justify-content:space-between}header a{font:28px 'Cormorant Garamond',serif;color:inherit;text-decoration:none}main{max-width:760px;margin:auto;padding:50px 20px 90px}h1{font:400 clamp(38px,6vw,55px) 'Cormorant Garamond',serif;margin:0}h2{font:400 28px 'Cormorant Garamond',serif;margin:0 0 14px}.panel{padding:24px;background:#fffdfa;border:1px solid #e3dbd1;border-radius:12px;margin:22px 0}label{display:block;margin:12px 0;font-size:12px}input,textarea,select{display:block;width:100%;border:1px solid #d8cfc2;background:#fff;padding:12px;font:13px Inter;margin-top:6px;border-radius:5px}textarea{resize:vertical;min-height:105px}button{background:#332d27;color:white;border:0;border-radius:5px;padding:12px 18px;cursor:pointer;font:12px Inter}button:disabled{opacity:.4;cursor:not-allowed}.muted{color:#817970}.status{min-height:28px}a{color:inherit}.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.management-menu{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:14px;border-bottom:1px solid #e3dfd7}.management-menu a{padding:8px 12px;border:1px solid #ded8ce;text-decoration:none;border-radius:5px;font-size:11px}</style></head><body><header><a href="./">E &amp; M</a><button id="language">ΕΛ / EN</button></header><nav class="management-menu"><a href="./dashboard.html" data-en="Dashboard" data-el="Πίνακας">Dashboard</a><a href="./guest-list.html" data-en="Guests" data-el="Καλεσμένοι">Guests</a><a href="./notifications.html" data-en="Guest opt-in page" data-el="Εγγραφή καλεσμένων">Guest opt-in page</a></nav><main><p class="muted">EVROS &amp; MARIA · 10.06.2028</p><h1 data-en="Guest announcements." data-el="Ανακοινώσεις καλεσμένων.">Guest announcements.</h1><p data-en="Send a push message to guests who have opted in on their devices." data-el="Στείλτε ειδοποίηση σε καλεσμένους που έχουν ενεργοποιήσει τις ειδοποιήσεις.">Send a push message to guests who have opted in on their devices.</p><section class="panel"><h2 data-en="Administrator access" data-el="Πρόσβαση διαχειριστή">Administrator access</h2><label><span data-en="Private administrator passcode" data-el="Ιδιωτικός κωδικός διαχειριστή">Private administrator passcode</span><input id="passcode" type="password" autocomplete="off" placeholder="Passcode"></label><button id="check" data-en="Check access & subscribers" data-el="Έλεγχος πρόσβασης & εγγραφών">Check access & subscribers</button><p class="status muted" id="access" role="status"></p></section><section class="panel"><h2 data-en="Compose announcement" data-el="Σύνταξη ανακοίνωσης">Compose announcement</h2><label><span data-en="Notification title" data-el="Τίτλος ειδοποίησης">Notification title</span><input id="title" maxlength="90" value="Evros & Maria"></label><label><span data-en="Message" data-el="Μήνυμα">Message</span><textarea id="message" maxlength="240" placeholder="Wedding announcement..."></textarea></label><label><span data-en="Open page when tapped" data-el="Σελίδα όταν πατηθεί">Open page when tapped</span><select id="path"><option value="./">Wedding homepage</option><option value="./timeline.html">Timeline</option><option value="./seating.html">Find your table</option><option value="./rsvp.html">RSVP</option><option value="./info.html">Guest information</option><option value="./album.html">Photo gallery</option></select></label><div class="actions"><button id="send" disabled data-en="Send to subscribed guests" data-el="Αποστολή σε εγγεγραμμένους καλεσμένους">Send to subscribed guests</button><span class="muted" id="result" role="status"></span></div></section><p><a href="./dashboard.html" data-en="← Back to dashboard" data-el="← Πίσω στον πίνακα">← Back to dashboard</a></p></main><script>const API='https://evros-maria-wedding.evros-christodoulou1995.workers.dev';let lang=localStorage.getItem('wedding-lang')==='el'?'el':'en',verified=false;const $=id=>document.getElementById(id),t=(en,el)=>lang==='el'?el:en;function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[lang])}$('language').onclick=()=>{lang=lang==='en'?'el':'en';localStorage.setItem('wedding-lang',lang);translate()};translate();$('check').onclick=async()=>{verified=false;$('send').disabled=true;const pass=$('passcode').value.trim();if(!pass)return;try{const r=await fetch(API+'/wedding/push/subscribers',{headers:{Authorization:'Bearer '+pass},cache:'no-store'});if(!r.ok)throw Error(r.status===401?'Unauthorized':'Unavailable');const d=await r.json();verified=true;$('send').disabled=false;$('access').textContent=t('Access verified. Subscribed devices: ','Η πρόσβαση επιβεβαιώθηκε. Εγγεγραμμένες συσκευές: ')+d.count}catch{$('access').textContent=t('Access unavailable. Check passcode and Cloudflare setup.','Η πρόσβαση δεν είναι διαθέσιμη. Ελέγξτε τον κωδικό και το Cloudflare.')}};$('passcode').oninput=()=>{verified=false;$('send').disabled=true};$('send').onclick=async()=>{if(!verified)return;const title=$('title').value.trim(),body=$('message').value.trim(),path=$('path').value;if(!title||!body)return alert(t('Enter a title and message.','Συμπληρώστε τίτλο και μήνυμα.'));if(!confirm(t('Send this announcement to all subscribed devices?','Αποστολή ανακοίνωσης σε όλες τις εγγεγραμμένες συσκευές;')))return;const pass=$('passcode').value.trim();$('send').disabled=true;let cursor=null,delivered=0,failed=0,batches=0;try{do{const r=await fetch(API+'/wedding/push/send',{method:'POST',headers:{Authorization:'Bearer '+pass,'Content-Type':'application/json'},body:JSON.stringify({title,body,path,cursor})});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();delivered+=d.delivered||0;failed+=d.failed||0;cursor=d.cursor;batches++;$('result').textContent=t('Sent: ','Απεστάλησαν: ')+delivered+' · '+t('Failed: ','Απέτυχαν: ')+failed;if(batches>100)throw Error('Too many batches')}while(cursor);$('result').textContent=t('Completed. Delivered: ','Ολοκληρώθηκε. Παραδόθηκαν: ')+delivered+' · '+t('Failed: ','Απέτυχαν: ')+failed}catch(e){$('result').textContent=t('Sending interrupted: ','Η αποστολή διακόπηκε: ')+e.message}finally{$('send').disabled=!verified}};</script></body></html>
