<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf9f7"><title>Wedding weather · Evros & Maria</title><link rel="icon" href="./monogram.png"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#faf9f7;color:#292723;font:300 14px/1.7 Inter,Arial,sans-serif}header{padding:18px 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e2ddd5}header a{font:28px 'Cormorant Garamond',serif;color:inherit;text-decoration:none}main{max-width:940px;margin:auto;padding:55px 24px 100px}.eyebrow{font-size:10px;letter-spacing:3px;color:#847c72}h1{font:400 clamp(40px,6vw,58px) 'Cormorant Garamond',serif;margin:8px 0}h2{font:400 30px 'Cormorant Garamond',serif;margin:0 0 12px}p{color:#746e66}button,.btn{background:#fffdfa;color:#342e28;border:1px solid #d8d0c6;border-radius:8px;padding:10px 15px;font:12px Inter;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.btn:hover{background:#f2ede6}input,select,textarea{padding:11px;border:1px solid #d9d3ca;background:#fffdfa;border-radius:6px;font:13px Inter;max-width:100%}label{display:grid;gap:4px;font-size:12px;color:#6b625a}.panel{background:#fffdfa;border:1px solid #e5dfd6;border-radius:12px;padding:22px;margin:18px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.grow{flex:1}.muted{color:#82796e;font-size:12px}.entry{border-top:1px solid #e9e3da;padding:14px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.entry strong{font-weight:500}.entry small{display:block;color:#82796e}.status{min-height:20px}footer{text-align:center;padding:28px;font-size:10px;letter-spacing:2px;border-top:1px solid #e5dfd6}.warn{background:#f4eee6;border-radius:7px;padding:12px}.progress{height:7px;background:#e9e2d9;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:#a9a08e;transition:width .2s}@media(max-width:560px){main{padding:36px 16px 70px}.panel{padding:15px}}</style></head><body><header><a href="./">E &amp; M</a><button id="language">ΕΛ / EN</button></header><main><div class="eyebrow">EVROS &amp; MARIA · 10.06.2028</div><h1 data-en="Wedding-day weather." data-el="Ο καιρός του γάμου.">Wedding-day weather.</h1><p data-en="Skarinou, Cyprus · Saturday, 10 June 2028" data-el="Σκαρίνου, Κύπρος · Σάββατο, 10 Ιουνίου 2028">Skarinou, Cyprus · Saturday, 10 June 2028</p><div class="panel"><h2 data-en="Wedding forecast" data-el="Πρόγνωση για τον γάμο">Wedding forecast</h2><p id="forecast" aria-live="polite"></p><div id="details" class="row"></div><button id="refresh" data-en="Refresh forecast ↻" data-el="Ανανέωση πρόγνωσης ↻">Refresh forecast ↻</button></div><p class="muted" data-en="Forecasts become available only within approximately 16 days of the event. Data: Open-Meteo." data-el="Η πρόγνωση διατίθεται περίπου 16 ημέρες πριν από την εκδήλωση. Δεδομένα: Open-Meteo.">Forecasts become available only within approximately 16 days of the event. Data: Open-Meteo.</p><p style="margin-top:30px"><a href="./" data-en="← Wedding website" data-el="← Ιστοσελίδα γάμου">← Wedding website</a></p></main><footer>EVROS &amp; MARIA · 10.06.2028</footer><script>let lang=localStorage.getItem('wedding-lang')==='el'?'el':'en';const t=(en,el)=>lang==='el'?el:en;function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(el=>el.textContent=el.dataset[lang])}document.getElementById('language').onclick=()=>{lang=lang==='en'?'el':'en';localStorage.setItem('wedding-lang',lang);translate();if(typeof render==='function')render()};translate();function render(){}async function load(){const el=document.getElementById('forecast'),details=document.getElementById('details');details.replaceChildren();const target=new Date('2028-06-10T12:00:00+03:00'),days=(target-Date.now())/86400000;if(days>16){el.textContent=t('The wedding is still too far away for a dependable forecast. Check back from 25 May 2028.','Ο γάμος είναι ακόμη μακριά για αξιόπιστη πρόγνωση. Επιστρέψτε από τις 25 Μαΐου 2028.');return}if(days< -1){el.textContent=t('The wedding date has passed.','Η ημερομηνία του γάμου έχει περάσει.');return}el.textContent=t('Loading forecast…','Φόρτωση πρόγνωσης…');try{const url='https://api.open-meteo.com/v1/forecast?latitude=34.820&longitude=33.356&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FNicosia&forecast_days=16';const response=await fetch(url);if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json(),i=data.daily.time.indexOf('2028-06-10');if(i<0){el.textContent=t('Forecast not yet available. Please check again later.','Η πρόγνωση δεν είναι ακόμη διαθέσιμη.');return}const d=data.daily;el.textContent=t('Forecast for 10 June 2028','Πρόγνωση για 10 Ιουνίου 2028');for(const [en,el,value] of [['High','Μέγιστη',d.temperature_2m_max[i]+'°C'],['Low','Ελάχιστη',d.temperature_2m_min[i]+'°C'],['Rain chance','Πιθανότητα βροχής',d.precipitation_probability_max[i]+'%']]){const card=document.createElement('div');card.className='panel';card.textContent=t(en,el)+': '+value;details.append(card)}}catch(e){el.textContent=t('Weather service unavailable. Try again later.','Η υπηρεσία καιρού δεν είναι διαθέσιμη. Δοκιμάστε αργότερα.')}}document.getElementById('refresh').onclick=load;load();</script></body></html>
