/* E & M editorial finish */:root{--em-paper:#faf9f7;--em-ink:#262420;--em-rule:#dfdcd6}body{background:var(--em-paper);color:var(--em-ink);-webkit-font-smoothing:antialiased}header{background:rgba(250,249,247,.97);backdrop-filter:blur(12px)}main{animation:emIn .5s ease both}#management-heading{scroll-margin-top:105px}h1,h2{letter-spacing:-.025em;line-height:1.13}button,.btn{transition:transform .2s,background .2s,border-color .2s}button:hover:not(:disabled),.btn:hover{transform:translateY(-2px);border-color:#918879}a{text-underline-offset:4px}:focus-visible{outline:2px solid #918879;outline-offset:3px}input:focus,select:focus,textarea:focus{outline:2px solid #b2aa9e;outline-offset:2px}.panel,.table-card,.seating-table{background:#fffdfa;box-shadow:0 8px 28px rgba(38,36,32,.03)}@keyframes emIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){main{animation:none}*,*:before,*:after{transition:none!important}}@media print{main{animation:none}}
.planning-panel{margin:24px 0;padding:24px;background:#fffdfa;border:1px solid #e2dcd3;border-radius:12px}.planning-heading{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:15px}.planning-heading h2{font:400 29px 'Cormorant Garamond',Georgia,serif;margin:0}.planning-heading p{font-size:11px;color:#79756e;margin:0}.planning-link{font-size:11px;text-decoration:none;border-bottom:1px solid #d4cabe;white-space:nowrap}.planning-table{padding:11px 0;border-bottom:1px solid #ebe5dc}.planning-table-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}.planning-table-top strong{font-weight:500}.planning-progress{height:5px;background:#eae4da;border-radius:6px;overflow:hidden}.planning-progress i{display:block;height:100%;background:#b8ae9e;border-radius:6px}.planning-table.over-capacity .planning-progress i{background:#aa7569}@media(max-width:520px){.planning-panel{padding:15px}.planning-heading{align-items:flex-start;flex-direction:column}}
.management-view .workspace-intro,.management-view #rsvp-summary,.management-view .planning-panel{display:none!important}.dashboard-overview #management-panel{display:none!important}.management-view #management-panel{padding-top:8px}.management-view #management-heading{margin-top:10px}.management-menu a[aria-current="page"]{background:#282620;color:#faf9f7}</style><style>.management-menu{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:20px 16px;border-bottom:1px solid #e3dfd7}.management-menu a{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border:1px solid #33302c;text-decoration:none;color:#282620;background:transparent;font:11px Inter,Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase;min-height:44px}.management-menu a[aria-current="page"]{background:#282620;color:#faf9f7}@media(max-width:600px){.management-menu{gap:7px}.management-menu a{padding:10px 12px;font-size:10px}}</style><style>main{min-height:70vh}.management-menu a[aria-current="page"]{background:#282620;color:#faf9f7}.management-page{max-width:960px;margin:auto;padding:35px 22px 75px}.management-page #items{margin-top:20px}.management-page .entry{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap}.management-page .admin-actions{display:flex;flex-wrap:wrap;gap:8px}@media(max-width:550px){.management-page{padding:25px 15px 65px}}</style></head><body><header><a class="wordmark" href="./">E &amp; M</a><button class="language" id="language" type="button">ΕΛ / EN</button></header><nav class="management-menu" aria-label="Wedding management"><a href="./dashboard.html" data-en="Dashboard" data-el="Πίνακας">Dashboard</a><a href="./suppliers.html" data-en="Budget" data-el="Έξοδα">Budget</a><a href="./payment-calendar.html" data-en="Payments" data-el="Πληρωμές">Payments</a><a href="./planning-checklist.html" data-en="Checklist" data-el="Λίστα">Checklist</a><a href="./manage-songs.html" data-en="Songs" data-el="Τραγούδια">Songs</a><a href="./manage-wishes.html" data-en="Wishes" data-el="Ευχές">Wishes</a><a href="./manage-photos.html" data-en="Photos" data-el="Φωτογραφίες">Photos</a><a href="./guest-list.html" data-en="Guest List" data-el="Καλεσμένοι">Guest List</a><a href="./seating-arrangement.html" data-en="Seating Arrangement" data-el="Διαχείριση τραπεζιών">Seating Arrangement</a></nav><main><section class="management-page"><div class="eyebrow">EVROS &amp; MARIA · 10.06.2028</div><h1 data-en="Photos" data-el="Φωτογραφίες">Photos</h1><p data-en="Manage uploaded wedding photos" data-el="Διαχείριση φωτογραφιών γάμου">Manage uploaded wedding photos</p><p class="status" id="status" aria-live="polite" role="status"></p><div class="panel" id="items">Loading…</div><div class="navlinks"><a href="./dashboard.html" data-en="← Back to dashboard" data-el="← Πίσω στον πίνακα">← Back to dashboard</a><a href="./album.html" data-en="View album" data-el="Προβολή άλμπουμ">View album</a><a href="./upload.html" data-en="Upload photos" data-el="Ανέβασμα φωτογραφιών">Upload photos</a></div></section></main><footer>EVROS &amp; MARIA · 10.06.2028</footer><script>
const API='https://evros-maria-wedding.evros-christodoulou1995.workers.dev';
let lang=localStorage.getItem('wedding-lang')==='el'?'el':'en';
const status=document.getElementById('status'),items=document.getElementById('items');
function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[lang])}
document.getElementById('language').onclick=()=>{lang=lang==='en'?'el':'en';localStorage.setItem('wedding-lang',lang);translate()};
async function listing(type){items.replaceChildren();status.textContent='';try{
const r=await fetch(API+'/wedding/admin/list?type='+type,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status+' — Worker update may not be deployed yet');
const d=await r.json();for(const item of d.entries||[]){
const div=document.createElement('div'),heading=document.createElement('strong'),p=document.createElement('p'),controls=document.createElement('div');
div.className='entry';controls.className='admin-actions';heading.textContent=item.name+(item.artist?' — '+item.artist:'')+(item.approved?' ✓':'');p.textContent=item.message;
for(const action of ['edit','approve','hide','delete']){
const btn=document.createElement('button');btn.type='button';btn.textContent=action;
btn.onclick=async()=>{if(action==='delete'&&!confirm('Permanently delete this entry?'))return;
const body={id:item.id,action};if(action==='edit'){
const name=prompt('Guest name',item.name);if(name===null)return;
const message=prompt(type==='song'?'Song title':'Wish',item.message);if(message===null)return;
body.name=name.trim();body.message=message.trim();
if(type==='song'){const artist=prompt('Artist',item.artist||'');if(artist===null)return;body.artist=artist.trim()}
if(!body.name||!body.message||(type==='song'&&!body.artist)){status.textContent='All fields are required.';return}}
try{const response=await fetch(API+'/wedding/admin/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!response.ok)throw Error('HTTP '+response.status);await listing(type)}catch(e){status.textContent='Action failed: '+e.message}};
controls.append(btn)}div.append(heading,p,controls);items.append(div)}
if(!d.entries?.length)items.textContent='No entries yet.'}catch(e){status.textContent='Unable to load entries: '+e.message}}
async function photos(){items.replaceChildren();status.textContent='';try{const r=await fetch(API+'/photos/list',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();for(const photo of d.photos||[]){
const div=document.createElement('div'),img=document.createElement('img'),btn=document.createElement('button');div.className='entry';img.src=API+'/photos/view?id='+encodeURIComponent(photo.id);img.loading='lazy';img.alt='Wedding photo';img.style.cssText='width:150px;max-height:150px;object-fit:cover;display:block';btn.textContent='Delete photo';btn.onclick=async()=>{if(!confirm('Permanently delete this photo?'))return;try{const r=await fetch(API+'/photos/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:photo.id})});if(!r.ok)throw Error('HTTP '+r.status);div.remove()}catch(e){status.textContent='Delete failed: '+e.message}};div.append(img,btn);items.append(div)}
if(!d.photos?.length)items.textContent='No photos yet.'}catch(e){status.textContent='Unable to load photos: '+e.message}}

document.querySelectorAll('.management-menu a').forEach(a=>{if(new URL(a.href).pathname===location.pathname)a.setAttribute('aria-current','page')});
translate();photos();
</script></body></html>
