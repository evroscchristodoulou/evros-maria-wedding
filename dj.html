<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf9f7"><title>DJ Song Requests · Evros & Maria</title><link rel="icon" href="./monogram.png"><style>:root{--ink:#262420;--muted:#79756e;--paper:#faf9f7;--rule:#dfdcd6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.7 Arial,sans-serif}header{padding:22px max(20px,calc((100vw - 900px)/2));border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center}a{color:inherit}header a{text-decoration:none}.brand{font:26px Georgia,serif}main{max-width:780px;margin:60px auto;padding:0 20px 70px;text-align:center}.eyebrow{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}h1{font:normal clamp(40px,7vw,65px) Georgia,serif;margin:15px 0}p{color:var(--muted)}#songs{margin-top:35px;text-align:left}.song{padding:19px 0;border-bottom:1px solid var(--rule)}.song strong{font-size:17px;font-weight:500}.song small{display:block;color:var(--muted);margin-top:4px}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}.button{border:1px solid var(--ink);padding:10px 17px;text-decoration:none;font-size:11px;letter-spacing:.08em}button{background:transparent;border:1px solid var(--ink);padding:8px 12px;cursor:pointer}footer{text-align:center;padding:30px;border-top:1px solid var(--rule);font-size:11px;color:var(--muted)}</style></head><body><header><a class="brand" href="./">E &amp; M</a><button id="lang" type="button">ΕΛ / EN</button></header><main><div class="eyebrow">EVROS &amp; MARIA · 10.06.2028</div><h1 data-en="DJ song requests" data-el="Μουσικές επιλογές">DJ song requests</h1><p data-en="Songs requested by our guests for the wedding celebration." data-el="Τραγούδια που ζήτησαν οι καλεσμένοι μας για τη γιορτή.">Songs requested by our guests for the wedding celebration.</p><div class="actions"><a class="button" href="./songs.html" data-en="Request a song" data-el="Ζητήστε τραγούδι">Request a song</a><button id="refresh" type="button" data-en="Refresh list" data-el="Ανανέωση λίστας">Refresh list</button></div><p id="status" role="status">Loading requests…</p><div id="songs"></div></main><footer>EVROS &amp; MARIA · 10.06.2028</footer><script>const API='https://evros-maria-wedding.evros-christodoulou1995.workers.dev';let lang=localStorage.getItem('wedding-lang')==='el'?'el':'en';const list=document.getElementById('songs'),status=document.getElementById('status');function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[lang])}async function load(){status.textContent=lang==='el'?'Φόρτωση…':'Loading requests…';list.replaceChildren();try{const r=await fetch(API+'/wedding/songs',{cache:'no-store'});if(!r.ok)throw Error(r.status===404?'The latest Worker code must be deployed.':'HTTP '+r.status);const data=await r.json();const songs=data.songs||[];status.textContent=songs.length?(lang==='el'?songs.length+' αιτήματα':songs.length+' requests'):(lang==='el'?'Δεν υπάρχουν αιτήματα ακόμα.':'No song requests yet.');for(const song of songs){const row=document.createElement('div'),title=document.createElement('strong'),meta=document.createElement('small');row.className='song';title.textContent=song.message+' — '+song.artist;meta.textContent=(lang==='el'?'Από: ':'Requested by: ')+(song.name||'Guest');row.append(title,meta);list.append(row)}}catch(e){status.textContent=(lang==='el'?'Αδυναμία φόρτωσης: ':'Unable to load: ')+e.message}}document.getElementById('lang').onclick=()=>{lang=lang==='en'?'el':'en';localStorage.setItem('wedding-lang',lang);translate();load()};document.getElementById('refresh').onclick=load;translate();load();</script></body></html>
