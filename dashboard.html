<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf9f7"><title>Private Dashboard · Evros & Maria</title><link rel="icon" href="./monogram.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"><style>
:root{--ink:#262420;--muted:#79756e;--paper:#faf9f7;--rule:#dfdcd6}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:300 14px/1.7 Inter,Arial,sans-serif}
button,a{font:inherit}a{color:inherit}header{max-width:1100px;margin:auto;padding:22px 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule)}
.wordmark{font:400 23px 'Cormorant Garamond',Georgia,serif;letter-spacing:.08em;text-decoration:none}.top-actions{display:flex;align-items:center;gap:9px}.icon-action{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--rule);border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;text-decoration:none}.icon-action svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.icon-action:hover{background:#eae7e1}.install-guide{max-width:600px;margin:0 auto 25px;padding:20px 24px;border:1px solid var(--rule);text-align:left}.install-guide[hidden]{display:none}.install-guide h2{font-size:30px;margin:0 0 8px}.install-guide p{font-size:13px;line-height:1.9;margin:0;color:#5e5a54}.language{border:1px solid var(--rule);border-radius:40px;padding:7px 15px;background:transparent;color:var(--ink);font-size:11px;letter-spacing:.1em;cursor:pointer}
main{max-width:1100px;margin:auto}.hero{text-align:center;padding:64px 24px 55px}.monogram{width:min(410px,83vw);max-height:310px;object-fit:contain;display:block;margin:0 auto 30px}.monogram-fallback{font:300 100px 'Cormorant Garamond',serif;display:none;line-height:1.3}.eyebrow{text-transform:uppercase;letter-spacing:.34em;font-size:10px;font-weight:400;color:var(--muted)}h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300}h1{font-size:clamp(55px,9vw,108px);letter-spacing:.035em;line-height:1.1;margin:18px 0 17px}.date{font:400 17px 'Cormorant Garamond',serif;letter-spacing:.32em}.venue{font-size:12px;letter-spacing:.25em;text-transform:uppercase;margin:20px 0 4px}.location{color:var(--muted);font-size:12px;letter-spacing:.12em}.line{width:74px;border:0;border-top:1px solid #aaa49b;margin:34px auto}
.countdown{display:flex;justify-content:center;gap:clamp(20px,6vw,72px);padding:29px 12px 33px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}.time{text-align:center;min-width:55px}.number{font:300 clamp(36px,6vw,60px)/1 'Cormorant Garamond',Georgia,serif}.time-label{display:block;margin-top:10px;text-transform:uppercase;font-size:9px;letter-spacing:.2em;color:var(--muted)}
.album{text-align:center;padding:65px 20px 80px;border-top:1px solid var(--rule)}.album h2{font-size:clamp(38px,6vw,62px);margin:10px 0 12px}.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;max-width:850px;margin:30px auto}.album-grid a{display:block;aspect-ratio:1;overflow:hidden;background:#eae7e1}.album-grid img{width:100%;height:100%;object-fit:cover;transition:transform .2s}.album-grid a:hover img{transform:scale(1.035)}.album-note{font-size:12px;color:var(--muted)}.photos{text-align:center;padding:65px 20px 85px;border-top:1px solid var(--rule)}.photos h2{font-size:clamp(38px,6vw,62px);line-height:1.12;margin:14px 0 18px}.photos p{font-size:13px;color:#5e5a54;max-width:490px;margin:0 auto 22px;line-height:1.9}.upload-area{max-width:480px;margin:28px auto 0;border:1px dashed #bdb7ad;padding:32px 22px}.upload-area input{display:none}.photo-note{margin-top:15px!important;font-size:11px!important;color:var(--muted)!important}.details{text-align:center;padding:74px 20px 85px}.details h2{font-size:clamp(38px,6vw,62px);line-height:1.12;margin:14px 0 22px}.details p{max-width:500px;margin:0 auto;color:#5e5a54;line-height:1.95;font-size:13px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:34px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border:1px solid var(--ink);font-size:10px;letter-spacing:.18em;text-decoration:none;text-transform:uppercase;transition:background .2s,color .2s}.btn.primary{background:var(--ink);color:var(--paper)}.btn:hover{background:#55514a;color:white}
footer{text-align:center;padding:25px 15px 38px;border-top:1px solid var(--rule);font-size:10px;letter-spacing:.2em;color:var(--muted)}
@media(max-width:600px){header{padding:15px 20px}.hero{padding:48px 16px 46px}.monogram{max-height:250px;margin-bottom:25px}h1{font-size:clamp(52px,13vw,75px)}.countdown{gap:12px}.time{min-width:61px}.details{padding:60px 20px 72px}.btn{width:min(290px,100%)}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}

.page{max-width:760px;margin:auto;padding:65px 22px 85px;text-align:center;min-height:65vh}.page h1{font-size:clamp(48px,8vw,82px)}.page p{color:var(--muted)}.form{max-width:500px;margin:32px auto;text-align:left;display:grid;gap:15px}.form label{font-size:11px;letter-spacing:.12em;text-transform:uppercase}.form input,.form textarea,.form select{display:block;width:100%;margin-top:7px;border:1px solid var(--rule);border-radius:0;background:white;padding:13px;color:var(--ink);font:14px Inter,Arial,sans-serif}.form textarea{min-height:110px;resize:vertical}.form button{cursor:pointer}.panel{border:1px solid var(--rule);padding:24px;margin:18px 0;text-align:left}.panel h2{font-size:32px;margin:0 0 8px}.navlinks{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:25px}.navlinks a{font-size:11px;border-bottom:1px solid var(--rule);text-decoration:none;padding:5px}.status{min-height:25px;color:var(--muted)}.entry{padding:18px 0;border-bottom:1px solid var(--rule);overflow-wrap:anywhere}.entry strong{font-weight:500}.entry p{margin:5px 0}.admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.admin-actions button{padding:8px 12px;border:1px solid var(--rule);background:transparent;cursor:pointer}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover}.photo-grid button{display:block;width:100%}@media(max-width:600px){header{padding:14px 12px}.top-actions{gap:4px}.icon-action{width:32px;height:32px}.page{padding:45px 17px}}
</style></head><body><header><a class="wordmark" href="./">E &amp; M</a><nav class="top-actions" aria-label="Wedding navigation"><a class="icon-action" href="./locations.html" title="Locations" aria-label="Locations">⌖</a><a class="icon-action" href="./songs.html" title="Song requests" aria-label="Song requests">♫</a><a class="icon-action" href="./guestbook.html" title="Guestbook" aria-label="Guestbook">♡</a><a class="icon-action" href="./album.html" title="Photo album" aria-label="Photo album">▧</a><a class="icon-action" href="./upload.html" title="Upload photos" aria-label="Upload photos">↑</a><button class="language" id="language" type="button">ΕΛ / EN</button></nav></header><main><section class="page"><div class="eyebrow">EVROS &amp; MARIA · 10.06.2028</div><h1 data-en="Wedding dashboard." data-el="Διαχείριση γάμου.">Wedding dashboard.</h1><p data-en="Private management for Evros & Maria. Use your Cloudflare ADMIN_SECRET." data-el="Ιδιωτική διαχείριση για Έβρο και Μαρία. Χρησιμοποιήστε το ADMIN_SECRET του Cloudflare.">Private management for Evros & Maria. Use your Cloudflare ADMIN_SECRET.</p><form class="form" id="login"><label><span data-en="Admin secret" data-el="Κωδικός διαχείρισης">Admin secret</span><input id="secret" type="password" autocomplete="off" required></label><button class="btn primary" data-en="Open dashboard" data-el="Άνοιγμα διαχείρισης">Open dashboard</button></form><p class="status" id="status" role="status"></p><div id="admin" hidden><div class="actions"><button class="btn" id="songs" type="button">Songs</button><button class="btn" id="wishes" type="button">Wishes</button><button class="btn" id="photos" type="button">Photos</button><button class="btn" id="logout" type="button">Lock</button></div><div id="items" class="panel"></div></div><div class="navlinks"><a href="./" data-en="Home" data-el="Αρχική">Home</a><a href="./locations.html" data-en="Locations" data-el="Τοποθεσίες">Locations</a><a href="./songs.html" data-en="Songs" data-el="Τραγούδια">Songs</a><a href="./guestbook.html" data-en="Guestbook" data-el="Ευχολόγιο">Guestbook</a><a href="./album.html" data-en="Album" data-el="Άλμπουμ">Album</a><a href="./upload.html" data-en="Upload photos" data-el="Φωτογραφίες">Upload photos</a></div></section></main><footer>EVROS &amp; MARIA · 10.06.2028</footer><script>const API='https://evros-maria-wedding.evros-christodoulou1995.workers.dev';let lang=localStorage.getItem('wedding-lang')==='el'?'el':'en';function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[lang])}document.getElementById('language').onclick=()=>{lang=lang==='en'?'el':'en';localStorage.setItem('wedding-lang',lang);translate()};translate();let secret='';const status=document.getElementById('status'),items=document.getElementById('items');const auth=()=>({'Authorization':'Bearer '+secret});async function listing(type){items.replaceChildren();try{const r=await fetch(API+'/wedding/admin/list?type='+type,{headers:auth()});if(!r.ok)throw Error('Unauthorized');const d=await r.json();for(const item of d.entries){const row=document.createElement('div');row.className='entry';const title=document.createElement('strong'),p=document.createElement('p'),controls=document.createElement('div');controls.className='admin-actions';title.textContent=item.name+(item.artist?' — '+item.artist:'')+(item.approved?' ✓':'');p.textContent=item.message;for(const action of ['approve','hide','delete']){const btn=document.createElement('button');btn.textContent=action;btn.onclick=async()=>{if(action==='delete'&&!confirm('Delete this entry?'))return;const result=await fetch(API+'/wedding/admin/update',{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({id:item.id,action})});if(result.ok)listing(type);else status.textContent='Action failed.'};controls.append(btn)}row.append(title,p,controls);items.append(row)}if(!d.entries.length)items.textContent='No entries yet.'}catch{status.textContent='Could not load entries.'}}async function photos(){items.replaceChildren();try{const r=await fetch(API+'/photos/list');if(!r.ok)throw Error();const d=await r.json();for(const photo of d.photos){const card=document.createElement('div');card.className='entry';const img=document.createElement('img');img.src=API+'/photos/view?id='+encodeURIComponent(photo.id);img.style.cssText='width:150px;max-height:150px;object-fit:cover;display:block';const btn=document.createElement('button');btn.textContent='Delete photo';btn.onclick=async()=>{if(!confirm('Permanently delete photo?'))return;const result=await fetch(API+'/photos/delete',{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({id:photo.id})});if(result.ok)card.remove();else status.textContent='Delete failed.'};card.append(img,btn);items.append(card)}if(d.cursor){const more=document.createElement('p');more.textContent='More photos exist; gallery shows first page.';items.append(more)}}catch{status.textContent='Unable to load photos.'}}document.getElementById('login').onsubmit=async e=>{e.preventDefault();secret=document.getElementById('secret').value;document.getElementById('secret').value='';try{const r=await fetch(API+'/wedding/admin/list?type=song',{headers:auth()});if(!r.ok)throw Error();document.getElementById('login').hidden=true;document.getElementById('admin').hidden=false;status.textContent='';listing('song')}catch{secret='';status.textContent='Invalid secret or Worker not deployed.'}};document.getElementById('songs').onclick=()=>listing('song');document.getElementById('wishes').onclick=()=>listing('wish');document.getElementById('photos').onclick=photos;document.getElementById('logout').onclick=()=>{secret='';document.getElementById('admin').hidden=true;document.getElementById('login').hidden=false;items.replaceChildren()};</script></body></html>
