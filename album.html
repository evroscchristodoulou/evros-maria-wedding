<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding Album | Evros & Maria</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./monogram.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"><style>
:root{--ink:#262420;--muted:#79756e;--paper:#faf9f7;--rule:#dfdcd6}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:300 14px/1.7 Inter,Arial,sans-serif}
button,a{font:inherit}a{color:inherit}header{max-width:1100px;margin:auto;padding:22px 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule)}
.wordmark{font:400 23px 'Cormorant Garamond',Georgia,serif;letter-spacing:.08em;text-decoration:none}.top-actions{display:flex;align-items:center;gap:9px}.icon-action{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--rule);border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;text-decoration:none}.icon-action svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.icon-action:hover{background:#eae7e1}.install-guide{max-width:600px;margin:0 auto 25px;padding:20px 24px;border:1px solid var(--rule);text-align:left}.install-guide[hidden]{display:none}.install-guide h2{font-size:30px;margin:0 0 8px}.install-guide p{font-size:13px;line-height:1.9;margin:0;color:#5e5a54}.language{border:1px solid var(--rule);border-radius:40px;padding:7px 15px;background:transparent;color:var(--ink);font-size:11px;letter-spacing:.1em;cursor:pointer}
main{max-width:1100px;margin:auto}.hero{text-align:center;padding:64px 24px 55px}.monogram{width:min(410px,83vw);max-height:310px;object-fit:contain;display:block;margin:0 auto 30px}.monogram-fallback{font:300 100px 'Cormorant Garamond',serif;display:none;line-height:1.3}.eyebrow{text-transform:uppercase;letter-spacing:.34em;font-size:10px;font-weight:400;color:var(--muted)}h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300}h1{font-size:clamp(55px,9vw,108px);letter-spacing:.035em;line-height:1.1;margin:18px 0 17px}.date{font:400 17px 'Cormorant Garamond',serif;letter-spacing:.32em}.venue{font-size:12px;letter-spacing:.25em;text-transform:uppercase;margin:20px 0 4px}.location{color:var(--muted);font-size:12px;letter-spacing:.12em}.line{width:74px;border:0;border-top:1px solid #aaa49b;margin:34px auto}
.countdown{display:flex;justify-content:center;gap:clamp(20px,6vw,72px);padding:29px 12px 33px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}.time{text-align:center;min-width:55px}.number{font:300 clamp(36px,6vw,60px)/1 'Cormorant Garamond',Georgia,serif}.time-label{display:block;margin-top:10px;text-transform:uppercase;font-size:9px;letter-spacing:.2em;color:var(--muted)}
.album{text-align:center;padding:65px 20px 80px;border-top:1px solid var(--rule)}.album h2{font-size:clamp(38px,6vw,62px);margin:10px 0 12px}.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;max-width:850px;margin:30px auto}.album-grid a{display:block;aspect-ratio:1;overflow:hidden;background:#eae7e1}.album-grid img{width:100%;height:100%;object-fit:cover;transition:transform .2s}.album-grid a:hover img{transform:scale(1.035)}.album-note{font-size:12px;color:var(--muted)}.photos{text-align:center;padding:65px 20px 85px;border-top:1px solid var(--rule)}.photos h2{font-size:clamp(38px,6vw,62px);line-height:1.12;margin:14px 0 18px}.photos p{font-size:13px;color:#5e5a54;max-width:490px;margin:0 auto 22px;line-height:1.9}.upload-area{max-width:480px;margin:28px auto 0;border:1px dashed #bdb7ad;padding:32px 22px}.upload-area input{display:none}.photo-note{margin-top:15px!important;font-size:11px!important;color:var(--muted)!important}.details{text-align:center;padding:74px 20px 85px}.details h2{font-size:clamp(38px,6vw,62px);line-height:1.12;margin:14px 0 22px}.details p{max-width:500px;margin:0 auto;color:#5e5a54;line-height:1.95;font-size:13px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:34px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border:1px solid var(--ink);font-size:10px;letter-spacing:.18em;text-decoration:none;text-transform:uppercase;transition:background .2s,color .2s}.btn.primary{background:var(--ink);color:var(--paper)}.btn:hover{background:#55514a;color:white}
footer{text-align:center;padding:25px 15px 38px;border-top:1px solid var(--rule);font-size:10px;letter-spacing:.2em;color:var(--muted)}
@media(max-width:600px){header{padding:15px 20px}.hero{padding:48px 16px 46px}.monogram{max-height:250px;margin-bottom:25px}h1{font-size:clamp(52px,13vw,75px)}.countdown{gap:12px}.time{min-width:61px}.details{padding:60px 20px 72px}.btn{width:min(290px,100%)}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
</style></head><body><header><a class="wordmark" href="./">E &amp; M</a><div class="top-actions"><a class="icon-action" href="./album.html" title="Album" aria-label="Album">▧</a><a class="icon-action" href="./upload.html" title="Upload" aria-label="Upload">↑</a><button id="language" class="language">ΕΛ / EN</button></div></header><main><section class="album" id="album" style="min-height:65vh">
<div class="eyebrow" data-en="Our favorite moments" data-el="Οι αγαπημένες μας στιγμές">Our favorite moments</div>
<h2 data-en="Wedding album." data-el="Άλμπουμ γάμου.">Wedding album.</h2>
<p class="album-note" id="album-status" aria-live="polite">Loading photos…</p>
<div class="actions"><a class="btn primary" href="./upload.html">Upload photos</a></div><div class="album-grid" id="album-grid"></div><div id="lightbox" hidden style="position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:999;display:none;align-items:center;justify-content:center;padding:45px 15px"><button id="close-photo" type="button" aria-label="Close" style="position:absolute;right:15px;top:12px;color:white;background:none;border:0;font-size:35px;cursor:pointer">×</button><button id="prev-photo" type="button" aria-label="Previous" style="position:absolute;left:8px;top:50%;background:none;border:0;color:white;font-size:36px;cursor:pointer">‹</button><img id="large-photo" alt="Wedding photo" style="max-width:90vw;max-height:83vh;object-fit:contain"><button id="next-photo" type="button" aria-label="Next" style="position:absolute;right:8px;top:50%;background:none;border:0;color:white;font-size:36px;cursor:pointer">›</button><a id="download-photo" target="_blank" rel="noopener noreferrer" style="position:absolute;bottom:15px;color:white;font-size:12px" download>Open / Download ↗</a></div>
<button type="button" class="btn" id="album-more" hidden data-en="Load more photos" data-el="Περισσότερες φωτογραφίες">Load more photos</button>
</section></main><footer>EVROS &amp; MARIA · 10.06.2028</footer><script>let lang='en';document.getElementById('language').addEventListener('click',()=>{lang=lang==='en'?'el':'en';document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(el=>{if(el.id!=='photo-status'&&el.id!=='album-status')el.textContent=el.dataset[lang]})});let cursor=null,busy=false;const grid=document.getElementById('album-grid'),status=document.getElementById('album-status'),more=document.getElementById('album-more');async function load(){if(busy)return;busy=true;more.hidden=true;try{const response=await fetch('https://evros-maria-wedding.evros-christodoulou1995.workers.dev/photos/list'+(cursor?'?cursor='+encodeURIComponent(cursor):''));if(!response.ok){let reason='';try{reason=(await response.json()).error||''}catch{}throw Error(reason||'Gallery unavailable (HTTP '+response.status+')')}const data=await response.json();for(const p of (data.photos||[])){const url='https://evros-maria-wedding.evros-christodoulou1995.workers.dev/photos/view?id='+encodeURIComponent(p.id),a=document.createElement('a'),img=document.createElement('img');img.onerror=()=>{img.alt='Photo unavailable';img.style.objectFit='contain'};a.href=url;a.addEventListener('click',e=>{e.preventDefault();showPhoto(Array.from(grid.children).indexOf(a))});a.rel='noopener noreferrer';img.src=url;img.loading='lazy';img.alt='Wedding photo';a.append(img);grid.append(a)}cursor=data.cursor;more.hidden=!cursor;status.textContent=grid.children.length?(lang==='el'?grid.children.length+' φωτογραφίες':grid.children.length+' photos'):(lang==='el'?'Δεν υπάρχουν φωτογραφίες ακόμα.':'No photos yet.')}catch(e){status.textContent=(lang==='el'?'Αδυναμία φόρτωσης άλμπουμ: ':'Unable to load album: ')+(e.message||'Connection error')+'.'}finally{busy=false}}more.addEventListener('click',load);load();let activePhoto=0;const lightbox=document.getElementById('lightbox');function showPhoto(index){const links=Array.from(grid.children);if(!links.length)return;activePhoto=(index+links.length)%links.length;const url=links[activePhoto].href;document.getElementById('large-photo').src=url;document.getElementById('download-photo').href=url;lightbox.hidden=false;lightbox.style.display='flex';document.body.style.overflow='hidden'}function closePhoto(){lightbox.hidden=true;lightbox.style.display='none';document.body.style.overflow=''}document.getElementById('close-photo').onclick=closePhoto;document.getElementById('prev-photo').onclick=()=>showPhoto(activePhoto-1);document.getElementById('next-photo').onclick=()=>showPhoto(activePhoto+1);lightbox.addEventListener('click',e=>{if(e.target===lightbox)closePhoto()});document.addEventListener('keydown',e=>{if(lightbox.hidden)return;if(e.key==='Escape')closePhoto();if(e.key==='ArrowLeft')showPhoto(activePhoto-1);if(e.key==='ArrowRight')showPhoto(activePhoto+1)});</script></body></html>
