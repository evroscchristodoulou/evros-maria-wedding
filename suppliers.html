<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf9f7"><title>Supplier management · Evros & Maria</title><link rel="icon" href="./monogram.png"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#faf9f7;color:#292723;font:300 14px/1.7 Inter,Arial,sans-serif}header{padding:18px 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e2ddd5}header a{font:28px 'Cormorant Garamond',serif;color:inherit;text-decoration:none}main{max-width:940px;margin:auto;padding:55px 24px 100px}.eyebrow{font-size:10px;letter-spacing:3px;color:#847c72}h1{font:400 clamp(40px,6vw,58px) 'Cormorant Garamond',serif;margin:8px 0}h2{font:400 30px 'Cormorant Garamond',serif;margin:0 0 12px}p{color:#746e66}button,.btn{background:#fffdfa;color:#342e28;border:1px solid #d8d0c6;border-radius:8px;padding:10px 15px;font:12px Inter;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.btn:hover{background:#f2ede6}input,select,textarea{padding:11px;border:1px solid #d9d3ca;background:#fffdfa;border-radius:6px;font:13px Inter;max-width:100%}label{display:grid;gap:4px;font-size:12px;color:#6b625a}.panel{background:#fffdfa;border:1px solid #e5dfd6;border-radius:12px;padding:22px;margin:18px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.grow{flex:1}.muted{color:#82796e;font-size:12px}.entry{border-top:1px solid #e9e3da;padding:14px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.entry strong{font-weight:500}.entry small{display:block;color:#82796e}.status{min-height:20px}footer{text-align:center;padding:28px;font-size:10px;letter-spacing:2px;border-top:1px solid #e5dfd6}.warn{background:#f4eee6;border-radius:7px;padding:12px}.progress{height:7px;background:#e9e2d9;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:#a9a08e;transition:width .2s}@media(max-width:560px){main{padding:36px 16px 70px}.panel{padding:15px}}</style></head><body><header><a href="./">E &amp; M</a><button id="language">ΕΛ / EN</button></header><main><div class="eyebrow">EVROS &amp; MARIA · 10.06.2028</div><h1 data-en="Wedding suppliers." data-el="Προμηθευτές γάμου.">Wedding suppliers.</h1><p data-en="Track suppliers, costs and upcoming payments." data-el="Οργανώστε προμηθευτές, κόστος και πληρωμές.">Track suppliers, costs and upcoming payments.</p><p class="warn" data-en="Saved on this device only, not shared with other devices. Avoid entering private contact details until admin security is enabled." data-el="Αποθηκεύεται μόνο σε αυτή τη συσκευή. Αποφύγετε προσωπικά στοιχεία πριν την ασφάλιση.">Saved on this device only, not shared with other devices. Avoid entering private contact details until admin security is enabled.</p><div class="panel"><div class="row"><label class="grow"><span data-en="Supplier / company" data-el="Προμηθευτής / εταιρεία">Supplier / company</span><input id="name" maxlength="100"></label><label><span data-en="Category" data-el="Κατηγορία">Category</span><select id="category"><option>Venue</option><option>Photography</option><option>Music</option><option>Flowers</option><option>Catering</option><option>Decoration</option><option>Other</option></select></label></div><div class="row" style="margin-top:12px"><label><span data-en="Agreed cost (€)" data-el="Συμφωνημένο κόστος (€)">Agreed cost (€)</span><input id="cost" type="number" min="0" step=".01"></label><label><span data-en="Paid (€)" data-el="Πληρώθηκε (€)">Paid (€)</span><input id="paid" type="number" min="0" step=".01"></label><label><span data-en="Next payment" data-el="Επόμενη πληρωμή">Next payment</span><input id="due" type="date"></label><button id="add" data-en="Add supplier +" data-el="Προσθήκη +">Add supplier +</button></div></div><div class="panel"><h2 data-en="Payment overview" data-el="Σύνοψη πληρωμών">Payment overview</h2><div id="totals"></div><div class="row"><button id="export" data-en="Export backup" data-el="Εξαγωγή αντιγράφου">Export backup</button><button id="import" data-en="Import backup" data-el="Εισαγωγή αντιγράφου">Import backup</button><input type="file" id="file" accept="application/json" hidden></div><div id="list"></div></div><p style="margin-top:30px"><a href="./" data-en="← Wedding website" data-el="← Ιστοσελίδα γάμου">← Wedding website</a></p></main><footer>EVROS &amp; MARIA · 10.06.2028</footer><script>let lang=localStorage.getItem('wedding-lang')==='el'?'el':'en';const t=(en,el)=>lang==='el'?el:en;function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(el=>el.textContent=el.dataset[lang])}document.getElementById('language').onclick=()=>{lang=lang==='en'?'el':'en';localStorage.setItem('wedding-lang',lang);translate();if(typeof render==='function')render()};translate();const KEY='em-suppliers-v1';let suppliers;try{suppliers=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{suppliers=[]}if(!Array.isArray(suppliers))suppliers=[];const save=()=>localStorage.setItem(KEY,JSON.stringify(suppliers));const money=n=>'€'+Number(n||0).toLocaleString('en-CY',{minimumFractionDigits:2,maximumFractionDigits:2});function render(){const cost=suppliers.reduce((n,s)=>n+Number(s.cost||0),0),paid=suppliers.reduce((n,s)=>n+Number(s.paid||0),0);document.getElementById('totals').textContent=t('Agreed: ','Συμφωνημένο: ')+money(cost)+' · '+t('Paid: ','Πληρώθηκε: ')+money(paid)+' · '+t('Remaining: ','Υπόλοιπο: ')+money(Math.max(0,cost-paid));const list=document.getElementById('list');list.replaceChildren();for(const s of suppliers){const row=document.createElement('div'),info=document.createElement('div'),name=document.createElement('strong'),details=document.createElement('small'),edit=document.createElement('button'),del=document.createElement('button');row.className='entry';info.className='grow';name.textContent=s.name;details.textContent=s.category+' · '+money(s.paid)+' / '+money(s.cost)+(s.due?' · '+s.due:'');info.append(name,details);edit.textContent=t('Edit payment','Αλλαγή πληρωμής');edit.onclick=()=>{const value=prompt(t('Amount paid (€)','Πληρωμένο ποσό (€)'),s.paid);if(value===null)return;const amount=Number(value);if(!Number.isFinite(amount)||amount<0||amount>100000000)return;s.paid=amount;save();render()};del.textContent='×';del.setAttribute('aria-label',t('Remove supplier','Διαγραφή προμηθευτή'));del.onclick=()=>{if(confirm(t('Remove supplier?','Διαγραφή προμηθευτή;'))){suppliers=suppliers.filter(x=>x.id!==s.id);save();render()}};row.append(info,edit,del);list.append(row)}}document.getElementById('add').onclick=()=>{const name=document.getElementById('name').value.trim(),cost=Number(document.getElementById('cost').value||0),paid=Number(document.getElementById('paid').value||0);if(!name||![cost,paid].every(n=>Number.isFinite(n)&&n>=0&&n<=100000000))return alert('Check supplier details');suppliers.push({id:crypto.randomUUID(),name,category:document.getElementById('category').value,cost,paid,due:document.getElementById('due').value});document.getElementById('name').value='';save();render()};document.getElementById('export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(suppliers,null,2)],{type:'application/json'}));a.href=url;a.download='wedding-suppliers.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data)||data.length>500||!data.every(x=>typeof x.name==='string'&&x.name.length<=100&&Number.isFinite(Number(x.cost))&&Number.isFinite(Number(x.paid))))throw Error();suppliers=data.map(x=>({id:crypto.randomUUID(),name:x.name,category:String(x.category||'Other').slice(0,50),cost:Math.max(0,Number(x.cost)),paid:Math.max(0,Number(x.paid)),due:String(x.due||'').slice(0,10)}));save();render()}catch{alert('Invalid backup file')}};render();</script></body></html>
