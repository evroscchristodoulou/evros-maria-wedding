name: Deploy wedding Worker (GitHub-managed admin secret)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required GitHub secrets
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$ADMIN_SECRET" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and ADMIN_SECRET in GitHub Actions secrets."
            exit 1
          fi
      - name: Deploy Worker code
        run: npx --yes wrangler@4 deploy
      - name: Set production ADMIN_SECRET from GitHub Actions secret
        shell: bash
        run: |
          printf '%s' "$ADMIN_SECRET" | npx --yes wrangler@4 secret put ADMIN_SECRET
