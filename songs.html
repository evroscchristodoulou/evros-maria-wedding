main{max-width:1100px;margin:auto}.hero{text-align:center;padding:64px 24px 55px}.monogram{width:min(410px,83vw);max-height:310px;object-fit:contain;display:block;margin:0 auto 30px}.monogram-fallback{font:300 100px 'Cormorant Garamond',serif;display:none;line-height:1.3}.eyebrow{text-transform:uppercase;letter-spacing:.34em;font-size:10px;font-weight:400;color:var(--muted)}h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300}h1{font-size:clamp(55px,9vw,108px);letter-spacing:.035em;line-height:1.1;margin:18px 0 17px}.date{font:400 17px 'Cormorant Garamond',serif;letter-spacing:.32em}.venue{font-size:12px;letter-spacing:.25em;text-transform:uppercase;margin:20px 0 4px}.location{color:var(--muted);font-size:12px;letter-spacing:.12em}.line{width:74px;border:0;border-top:1px solid #aaa49b;margin:34px auto}

</style></head><body><header><a class="wordmark" href="./">E &amp; M</a><nav class="top-actions" aria-label="Wedding navigation"><a class="icon-action" href="./locations.html" title="Locations" aria-label="Locations">⌖</a><a class="icon-action" href="./songs.html" title="Song requests" aria-label="Song requests">♫</a><a class="icon-action" href="./guestbook.html" title="Guestbook" aria-label="Guestbook">♡</a><a class="icon-action" href="./album.html" title="Photo album" aria-label="Photo album">▧</a><a class="icon-action" href="./upload.html" title="Upload photos" aria-label="Upload photos">↑</a><button class="language" id="language" type="button">ΕΛ / EN</button></nav></header><main><section class="page"><div class="eyebrow">EVROS &amp; MARIA · 10.06.2028</div><h1 data-en="The soundtrack of our day." data-el="Η μουσική της ημέρας μας.">The soundtrack of our day.</h1><p data-en="Suggest a song for DJ Kairinos. Requests are reviewed before sharing." data-el="Προτείνετε ένα τραγούδι για τον DJ Kairinos. Οι προτάσεις ελέγχονται πριν κοινοποιηθούν.">Suggest a song for DJ Kairinos. Requests are reviewed before sharing.</p><form id="request" class="form"><label><span data-en="Your name" data-el="Το όνομά σας">Your name</span><input name="name" maxlength="80" required></label><label><span data-en="Song title" data-el="Τίτλος τραγουδιού">Song title</span><input name="message" maxlength="150" required></label><label><span data-en="Artist" data-el="Καλλιτέχνης">Artist</span><input name="artist" maxlength="100" required></label><button class="btn primary" data-en="Send request" data-el="Αποστολή πρότασης">Send request</button><p class="status" id="result" role="status"></p></form><div class="navlinks"><a href="./" data-en="Home" data-el="Αρχική">Home</a><a href="./locations.html" data-en="Locations" data-el="Τοποθεσίες">Locations</a><a href="./songs.html" data-en="Songs" data-el="Τραγούδια">Songs</a><a href="./guestbook.html" data-en="Guestbook" data-el="Ευχολόγιο">Guestbook</a><a href="./album.html" data-en="Album" data-el="Άλμπουμ">Album</a><a href="./upload.html" data-en="Upload photos" data-el="Φωτογραφίες">Upload photos</a></div></section></main><footer>EVROS &amp; MARIA · 10.06.2028</footer><script>const API='https://evros-maria-wedding.evros-christodoulou1995.workers.dev';let lang=localStorage.getItem('wedding-lang')==='el'?'el':'en';function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[lang])}document.getElementById('language').onclick=()=>{lang=lang==='en'?'el':'en';localStorage.setItem('wedding-lang',lang);translate()};translate();document.getElementById('request').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button'),result=document.getElementById('result');b.disabled=true;try{const payload=Object.fromEntries(new FormData(f));const r=await fetch(API+'/wedding/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,type:'song'})});if(!r.ok)throw Error();result.textContent=lang==='el'?'Ευχαριστούμε! Η πρότασή σας καταχωρήθηκε.':'Thank you! Your song request was received.';f.reset()}catch{result.textContent=lang==='el'?'Δεν ήταν δυνατή η αποστολή.':'Unable to send. Please try again.'}finally{b.disabled=false}};</script></body></html>
